<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wedding Portal | Karen Swan Art</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .project-hero-wrap { position: relative; }
    .collection-stamp { position: absolute; top: 26px; left: 0; display: inline-flex; align-items: center; gap: 10px; padding: 10px 16px; border: 1px solid rgba(140,48,76,.22); border-radius: 999px; background: rgba(255,248,242,.82); backdrop-filter: blur(8px); box-shadow: 0 10px 26px rgba(69,29,39,.08); color: var(--accent-deep); font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; line-height: 1.2; z-index: 2; }
    .collection-stamp::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(135deg, var(--gold), var(--accent-soft)); box-shadow: 0 0 0 4px rgba(201,154,79,.12); flex: 0 0 auto; }
    .single-centered-row { max-width: 760px; margin: 0 auto 28px; }
    .single-centered-row .art-card { background: transparent; border: none; box-shadow: none; }
    .single-centered-row .art-card img { width: 100%; height: auto; display: block; object-fit: contain; background: transparent; }
    @media (max-width: 900px) { .collection-stamp { position: static; margin: 26px 0 0; justify-content: center; } .project-hero-wrap .page-hero { padding-top: 34px; } }
    @media (max-width: 760px) { .single-centered-row { max-width: 100%; } .collection-stamp { font-size: .72rem; letter-spacing: .1em; padding: 9px 14px; } }
  </style>
</head>
<body>
  <div id="site-nav"></div>
  <main class="page-shell standalone-page">
    <div class="project-hero-wrap">
      <div class="collection-stamp">Brenda Folkert Collection</div>
      <header class="page-hero"><h1>Wedding Portal</h1></header>
    </div>
    <section class="single-centered-row">
      <article class="art-card"><img src="KSA/wedding-portal.png" alt="Wedding Portal featured image" class="project-image" /></article>
    </section>
  </main>
  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox-close" id="lightbox-close" aria-label="Close image view">&times;</button>
    <img id="lightbox-image" src="" alt="" />
  </div>
  <script src="nav.js"></script>
  <script>
    const lightbox = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightbox-image');
    const lightboxClose = document.getElementById('lightbox-close');
    document.querySelectorAll('.project-image').forEach((img) => {
      img.addEventListener('click', () => {
        lightboxImage.src = img.src; lightboxImage.alt = img.alt; lightbox.hidden = false; lightbox.classList.add('open'); document.body.style.overflow = 'hidden';
      });
    });
    function closeLightbox() { lightbox.classList.remove('open'); lightbox.hidden = true; lightboxImage.src = ''; lightboxImage.alt = ''; document.body.style.overflow = ''; }
    lightboxClose.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !lightbox.hidden) closeLightbox(); });
  </script>
</body>
</html>
